# Builds the demo from source and publishes it to GitHub Pages.
#
# The build is deterministic apart from the fonts and React it downloads on first run, so the
# workflow rebuilds rather than deploying the copy committed under web/demo/. A committed
# artifact can drift from its source; this repository has already shipped a stale one once.
name: Publish demo

on:
  push:
    branches: [main]
    paths:
      - "web/demo/**"
      - "react-native/**"
      - "models/ondevice/**"
      - "scripts/build_web_demo.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push should not queue behind an older build.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The build installs TypeScript into .cache/ itself; it needs no Python dependencies.
      - name: Build the demo
        run: python3 scripts/build_web_demo.py

      # A page that silently failed to build would deploy the previous index.html, so check the
      # output is a whole page with the runtime and the model actually inside it.
      - name: Check the output
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page = Path("web/demo/index.html").read_text(encoding="utf-8")
          size = len(page.encode("utf-8"))
          assert size > 1_500_000, f"page is only {size} bytes - the model is not inlined"
          for marker in ("__BERN_RUNTIME__", "INTENT_BUNDLE", "glyphFeatures"):
              assert marker in page, f"missing {marker}"
          for leftover in ("__INTENT_BUNDLE__", "__MASCOT_FACE__"):
              assert leftover not in page, f"unsubstituted placeholder {leftover}"
          assert page.count('type: "file"') >= 2, "composer inputs missing"
          print(f"index.html {size/1024/1024:.2f} MB, markers present")
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
